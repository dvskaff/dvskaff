<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Email Experiment &amp; Uplift Modeling"><title>Email Experiment &amp; Uplift Modeling</title><rect x="0.5" y="0.5" width="879" height="249" rx="14" fill="#0f1c30" stroke="#24374f"/><style>.live{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}</style><rect x="28" y="28" width="137.6" height="22" rx="11" fill="#f2804f" fill-opacity="0.14"/><text x="96.8" y="43.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#f2804f" text-anchor="middle">CAUSAL INFERENCE</text><circle class="live" cx="183.553" cy="39" r="4.5" fill="#3fcf6e"/><text x="193.6" y="43.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3fcf6e" text-anchor="start">LIVE</text><text x="28.0" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#eef4fb" text-anchor="start">Email Experiment &amp; Uplift Modeling</text><text x="28.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9fb3cb" text-anchor="start">Did a marketing email work, for whom, and who should get one next?</text><text x="28.0" y="133.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9fb3cb" text-anchor="start">A/B testing plus causal-forest uplift models and a targeting simulator.</text><rect x="28.0" y="168" width="67.8" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="61.9" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">EconML</text><rect x="103.8" y="168" width="77.6" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="142.6" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">LightGBM</text><rect x="189.4" y="168" width="56.0" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="217.4" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">SHAP</text><rect x="253.5" y="168" width="88.7" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="297.8" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">statsmodels</text><rect x="350.1" y="168" width="67.8" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="384.1" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">DuckDB</text><text x="28.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb3cb" text-anchor="start">Analysis reruns on every push</text><line x1="520" x2="520" y1="28" y2="222" stroke="#24374f"/><text x="550.0" y="71.3" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#5aa8ff" text-anchor="start">64K</text><text x="670.0" y="56.3" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">customers in a randomized</text><text x="670.0" y="74.3" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">experiment</text><text x="550.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#f2804f" text-anchor="start">+72%</text><text x="670.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">site visits from the best email</text><text x="550.0" y="200.7" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#a493ff" text-anchor="start">+17%</text><text x="670.0" y="185.7" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">est. profit from targeting vs.</text><text x="670.0" y="203.7" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">emailing all</text></svg>
