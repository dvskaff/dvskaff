<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="NYC Citi Bike Demand Forecasting"><title>NYC Citi Bike Demand Forecasting</title><rect x="0.5" y="0.5" width="879" height="249" rx="14" fill="#0f1c30" stroke="#24374f"/><style>.live{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}</style><rect x="28" y="28" width="113.3" height="22" rx="11" fill="#5aa8ff" fill-opacity="0.14"/><text x="84.6" y="43.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#5aa8ff" text-anchor="middle">TIME-SERIES ML</text><circle class="live" cx="159.288" cy="39" r="4.5" fill="#3fcf6e"/><text x="169.3" y="43.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3fcf6e" text-anchor="start">LIVE</text><text x="28.0" y="84.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#eef4fb" text-anchor="start">NYC Citi Bike Demand Forecasting</text><text x="28.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9fb3cb" text-anchor="start">Forecasts daily ridership 30 days ahead from every public trip and daily</text><text x="28.0" y="133.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9fb3cb" text-anchor="start">weather; retrained and redeployed by GitHub Actions.</text><rect x="28.0" y="168" width="77.6" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="66.8" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">LightGBM</text><rect x="113.6" y="168" width="63.0" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="145.1" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">Optuna</text><rect x="184.6" y="168" width="61.6" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="215.4" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">MLflow</text><rect x="254.2" y="168" width="56.0" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="282.2" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">SHAP</text><rect x="318.2" y="168" width="67.8" height="26" rx="13.0" fill="#0a1424" stroke="#2c4363"/><text x="352.1" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef4fb" text-anchor="middle">DuckDB</text><text x="28.0" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb3cb" text-anchor="start">Retrains itself every month</text><line x1="520" x2="520" y1="28" y2="222" stroke="#24374f"/><text x="550.0" y="71.3" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#5aa8ff" text-anchor="start">8.5%</text><text x="670.0" y="56.3" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">forecast error (WAPE), 30</text><text x="670.0" y="74.3" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">days ahead</text><text x="550.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#f2804f" text-anchor="start">−45%</text><text x="670.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">error vs. best statistical</text><text x="670.0" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">baseline</text><text x="550.0" y="200.7" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#a493ff" text-anchor="start">160M</text><text x="670.0" y="194.7" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#9fb3cb" text-anchor="start">trips analyzed with DuckDB</text></svg>
