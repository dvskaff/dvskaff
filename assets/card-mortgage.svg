<svg xmlns="http://www.w3.org/2000/svg" width="440" height="318" viewBox="0 0 440 318" role="img" aria-label="Mortgage Denial Modeling &amp; Fair-Lending Audit: 0.85 ROC AUC on a held-out year (349K applications)"><title>Mortgage Denial Modeling &amp; Fair-Lending Audit: 0.85 ROC AUC on a held-out year (349K applications)</title><rect x="0.5" y="0.5" width="439" height="317" rx="14" fill="#0f1c30" stroke="#24374f"/><style>.live{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}</style><rect x="22" y="22" width="147.5" height="20" rx="10" fill="#f2804f" fill-opacity="0.14"/><text x="95.8" y="36.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#f2804f" text-anchor="middle">CREDIT RISK · FAIRNESS</text><circle class="live" cx="185.507" cy="32" r="4" fill="#3fcf6e"/><text x="194.5" y="36.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3fcf6e" text-anchor="start">LIVE</text><text x="22.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef4fb" text-anchor="start">Mortgage Denial Modeling &amp; Fair-Lending</text><text x="22.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef4fb" text-anchor="start">Audit</text><text x="22.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb3cb" text-anchor="start">Which mortgage applications get denied, and are some groups denied</text><text x="22.0" y="133.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb3cb" text-anchor="start">more after accounting for credit factors? Public HMDA data for Georgia.</text><line x1="22" x2="418" y1="158" y2="158" stroke="#24374f"/><text x="22.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#eef4fb" text-anchor="start">0.85</text><text x="22.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#9fb3